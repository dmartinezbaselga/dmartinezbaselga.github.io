# Academic Pages site configuration
# Start here when changing your name, affiliation, links, or deployment URL.

locale: "en-US"
site_theme: "default"
title: "Diego Martinez-Baselga"
title_separator: "—"
name: &name "Diego Martinez-Baselga"
description: &description "Academic website of Diego Martinez-Baselga, postdoctoral researcher."

# For a user site, use https://USERNAME.github.io and leave baseurl empty.
# For a project site, use https://USERNAME.github.io and baseurl: /REPOSITORY.
url: "https://dmartinezbaselga.github.io"
baseurl: ""
repository: "dmartinezbaselga/dmartinezbaselga.github.io"

# Set this to /files/cv.pdf after adding that file to show a PDF download link.
cv_pdf:

author:
  avatar: "diego.jpg"
  name: "Diego Martinez-Baselga"
  pronouns:
  bio: "Postdoctoral Researcher · Autonomous Multi-Robots Lab · Delft University of Technology"
  location: "Delft, The Netherlands"
  employer: "Delft University of Technology"
  uri:
  email: "diegomartinez@unizar.es"

  academia:
  arxiv:
  googlescholar: "https://scholar.google.es/citations?user=FkfcNXQAAAAJ&hl=en"
  inspire-hep:
  impactstory:
  orcid: "https://orcid.org/0000-0002-2029-2851"
  semantic:
  ssrn:
  pubmed:
  researchgate:
  scopus:
  zotero:

  bitbucket:
  codepen:
  dribbble:
  github: "dmartinezbaselga"
  kaggle:
  stackoverflow:

  artstation:
  bluesky:
  facebook:
  flickr:
  foursquare:
  goodreads:
  google_plus:
  keybase:
  instagram:
  lastfm:
  linkedin: https://www.linkedin.com/in/diego-mart%C3%ADnez-baselga-2ba1691b6
  mastodon:
  medium:
  pinterest:
  soundcloud:
  steam:
  telegram:
  tumblr:
  twitter:
  vine:
  weibo:
  wikipedia:
  xing:
  youtube:
  zhihu:

# Keys match the `category` value in each file under _publications.
publication_category:
  preprints:
    title: "Preprints"
  journals:
    title: "Journal Articles"
  conferences:
    title: "Conference Proceedings"
  workshops:
    title: "Workshops and Colloquiums"

teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
comments:
  provider:
atom_feed:
  hide: true

google_site_verification:
bing_site_verification:
og_image:
og_description: *description
social:
  type: Person
  name: *name
  links:

analytics:
  provider: "false"

include:
  - _pages
  - files
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - _templates
  - assets/js/_main.js
  - assets/js/plugins
  - Dockerfile
  - _config_docker.yml
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Madrid

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
